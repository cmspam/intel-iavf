name: arch

# Build the iavf-dkms Arch/CachyOS package at the committed pkgver and publish
# it as a pacman repo on the 'latest' release. Consumers (e.g. cache22) point a
# pacman repo at that release; the DKMS module is compiled against the
# consumer's kernel at install time. The pkgver is maintained by update.yml.
on:
  schedule:
    - cron: '37 5 * * *'
  push:
    branches: [main]
    paths:
      - 'arch/**'
      - '.github/workflows/arch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arch
  cancel-in-progress: false

env:
  TAG: arch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate on published version
        id: gate
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^pkgver=//p' arch/PKGBUILD)
          echo "pkgver=$ver" >> "$GITHUB_OUTPUT"
          assets=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' 2>/dev/null || true)
          if printf '%s\n' "$assets" | grep -q "iavf-dkms-${ver}-"; then
            echo "iavf-dkms $ver already published"; echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build iavf-dkms + pacman repo db
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          mkdir -p out && chmod 777 out
          docker run --rm \
            -v "$PWD/arch:/pkg:ro" -v "$PWD/out:/out" \
            docker.io/cachyos/cachyos-v3:latest bash -c '
              set -e
              pacman -Sy --noconfirm --needed base-devel dkms >/dev/null
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              cp -r /pkg /tmp/build && chown -R builder:builder /tmp/build
              cd /tmp/build
              sudo -u builder makepkg --noconfirm --skippgpcheck --noprogressbar -f
              repo-add iavf-dkms.db.tar.gz *.pkg.tar.zst
              cp -v *.pkg.tar.zst /out/
              cp -v iavf-dkms.db.tar.gz /out/iavf-dkms.db
              cp -v iavf-dkms.files.tar.gz /out/iavf-dkms.files
            '
          echo "Repo contents:"; ls -l out

      - name: Publish pacman repo to '${{ env.TAG }}' release
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.gate.outputs.pkgver }}"
          notes="Pacman repo for the Intel out-of-tree iavf driver (iavf-dkms ${ver}). Tracks the latest stable Intel ethernet-linux-iavf release. Consume with: SigLevel = Optional TrustAll, Server = https://github.com/${REPO}/releases/download/${TAG}"
          gh release delete "$TAG" -R "$REPO" --yes 2>/dev/null || true
          gh release create "$TAG" out/* -R "$REPO" --title "iavf-dkms (rolling pacman repo)" --notes "$notes"
