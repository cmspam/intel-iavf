name: arch

# Build the iavf-dkms and i40e-dkms Arch/CachyOS packages at the committed
# pkgvers and publish them as a single pacman repo on the 'arch' release.
# Consumers (e.g. cache22) point one pacman repo at that release; the DKMS
# modules are compiled against the consumer's kernel at install time. The
# pkgvers are maintained by update.yml.
on:
  schedule:
    - cron: '37 5 * * *'
  push:
    branches: [main]
    paths:
      - 'arch/**'
      - '.github/workflows/arch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arch
  cancel-in-progress: false

env:
  TAG: arch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate on published versions
        id: gate
        run: |
          set -euo pipefail
          iavfver=$(sed -n 's/^pkgver=//p' arch/PKGBUILD)
          i40ever=$(sed -n 's/^pkgver=//p' arch/i40e/PKGBUILD)
          echo "iavfver=$iavfver" >> "$GITHUB_OUTPUT"
          echo "i40ever=$i40ever" >> "$GITHUB_OUTPUT"
          assets=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets[].name' 2>/dev/null || true)
          build=false
          printf '%s\n' "$assets" | grep -q "iavf-dkms-${iavfver}-" || build=true
          printf '%s\n' "$assets" | grep -q "i40e-dkms-${i40ever}-" || build=true
          echo "iavf-dkms $iavfver / i40e-dkms $i40ever (build=$build)"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Build iavf-dkms + i40e-dkms + pacman repo db
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          sde=$(git log -1 --format=%ct)
          mkdir -p out && chmod 777 out
          docker run --rm \
            -e SOURCE_DATE_EPOCH="$sde" \
            -v "$PWD/arch:/pkg:ro" -v "$PWD/out:/out" \
            docker.io/cachyos/cachyos-v3:latest bash -c '
              set -e
              pacman -Sy --noconfirm --needed base-devel dkms >/dev/null
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              cp -r /pkg /tmp/build && chown -R builder:builder /tmp/build
              # iavf (arch/PKGBUILD) and i40e (arch/i40e/PKGBUILD)
              cd /tmp/build
              sudo -u builder makepkg --noconfirm --skippgpcheck --noprogressbar -f
              cd /tmp/build/i40e
              sudo -u builder makepkg --noconfirm --skippgpcheck --noprogressbar -f
              # one shared pacman db holding both packages
              cd /tmp/build
              repo-add iavf-dkms.db.tar.gz *.pkg.tar.zst i40e/*.pkg.tar.zst
              cp -v *.pkg.tar.zst i40e/*.pkg.tar.zst /out/
              cp -v iavf-dkms.db.tar.gz /out/iavf-dkms.db
              cp -v iavf-dkms.files.tar.gz /out/iavf-dkms.files
            '
          echo "Repo contents:"; ls -l out

      - name: Publish pacman repo to '${{ env.TAG }}' release
        if: steps.gate.outputs.build == 'true'
        run: |
          set -euo pipefail
          iavfver="${{ steps.gate.outputs.iavfver }}"
          i40ever="${{ steps.gate.outputs.i40ever }}"
          notes="Pacman repo for the Intel out-of-tree NIC drivers (iavf-dkms ${iavfver}, i40e-dkms ${i40ever}). Tracks the latest stable Intel ethernet-linux releases. Consume with: SigLevel = Optional TrustAll, Server = https://github.com/${REPO}/releases/download/${TAG}"
          gh release delete "$TAG" -R "$REPO" --yes 2>/dev/null || true
          gh release create "$TAG" out/* -R "$REPO" --title "iavf-dkms + i40e-dkms (rolling pacman repo)" --notes "$notes"
