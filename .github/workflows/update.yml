name: update

# Track the latest stable Intel ethernet-linux releases (iavf and i40e). When
# either changes, bump its pinned version + checksum, commit, and kick off the
# per-target build workflows. iavf is tracked across the Arch PKGBUILD, the
# OpenWrt Makefile, and the Nix flake; i40e is the Arch/CachyOS DKMS package
# only. This is the only place the versions are bumped.
on:
  schedule:
    - cron: '11 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Bump to latest stable iavf + i40e
        run: |
          set -euo pipefail
          git config user.name cmspam
          git config user.email cmspam@users.noreply.github.com
          changed=0

          # iavf: tracked across Arch, OpenWrt, Nix.
          eval "$(bash scripts/latest-iavf.sh)"   # sets: version, url, sha256
          cur=$(sed -n 's/^pkgver=//p' arch/PKGBUILD)
          echo "iavf current=$cur latest=$version"
          if [ "$version" != "$cur" ]; then
            sed -i -e "s/^pkgver=.*/pkgver=${version}/" \
                   -e "s|^sha256sums=.*|sha256sums=('${sha256}')|" arch/PKGBUILD
            sed -i -e "s/^PKG_VERSION:=.*/PKG_VERSION:=${version}/" \
                   -e "s/^PKG_HASH:=.*/PKG_HASH:=${sha256}/" openwrt/package/iavf-intel/Makefile
            sed -i -e "s/\(version = \"\)[^\"]*\(\";\)/\1${version}\2/" \
                   -e "s/\(sha256 = \"\)[^\"]*\(\";\)/\1${sha256}\2/" flake.nix
            git commit -am "iavf: bump to ${version}"
            changed=1
          fi

          # i40e: Arch/CachyOS DKMS package only.
          eval "$(bash scripts/latest-i40e.sh)"   # sets: version, url, sha256
          cur=$(sed -n 's/^pkgver=//p' arch/i40e/PKGBUILD)
          echo "i40e current=$cur latest=$version"
          if [ "$version" != "$cur" ]; then
            sed -i -e "s/^pkgver=.*/pkgver=${version}/" \
                   -e "s|^sha256sums=.*|sha256sums=('${sha256}')|" arch/i40e/PKGBUILD
            git commit -am "i40e: bump to ${version}"
            changed=1
          fi

          [ "$changed" = 1 ] || { echo "already at latest"; exit 0; }
          git push

          for wf in arch.yml openwrt.yml debian.yml nix.yml; do
            gh workflow run "$wf" -R "$REPO" || true
          done
